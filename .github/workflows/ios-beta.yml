name: iOS beta (EAS Build and TestFlight; manual, owner-gated)
# Release engineering for the physical-iPhone beta (docs/mobile/ios-testflight-beta.md). Nothing here runs on push or on a schedule.
# The only automatic trigger is the secret-free, read-only config-check on pull requests; build and submit are workflow_dispatch only.
#  * config-check   runs on pull requests that touch the mobile app: resolves the preview Expo config, no secrets, no Apple, no EAS.
#  * build          manual; needs the "ios-beta" environment (owner approval) and the EXPO_TOKEN secret; starts an EAS cloud build
#                   of the "testflight" profile. Signing credentials live in EAS (created interactively once by the owner), never in Git.
#  * submit         manual; needs the "ios-beta-submit" environment (owner approval), the exact confirmation text and the EAS build id
#                   to upload (the reviewer approves that build), plus the non-secret variable ASC_APP_ID; uploads to App Store Connect /
#                   TestFlight. No upload happens without an explicit run of this job.
on:
  pull_request:
    paths:
      - apps/customer-mobile/**
      - .github/workflows/ios-beta.yml
      - deploy/web-preview/identity/matbakhy-realm.preview.json
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [config-check, build, submit]
        default: config-check
      confirm:
        description: "build: type BUILD-IOS-BETA. submit: type SUBMIT-TO-TESTFLIGHT. Ignored for config-check."
        type: string
        default: ""
      build_id:
        description: "submit only: the EAS build id (UUID) printed by the build run. The reviewer approves exactly this build."
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ios-beta-${{ github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: "24.21.0"
  # SHA-256 of node-v24.21.0-linux-x64.tar.xz from https://nodejs.org/dist/v24.21.0/SHASUMS256.txt
  NODE_SHA256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  EAS_CLI: "eas-cli@24.10.0"
jobs:
  config-check:
    if: github.event_name == 'pull_request' || inputs.action == 'config-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-11
      - name: Install pinned Node.js (checksum verified)
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" && tar xJf "node-v${NODE_VERSION}-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Beta identity, endpoints and registration guards
        run: python3 -m unittest scripts.test_ios_beta_config -v
      - name: Resolve the preview Expo config (what EAS would build)
        working-directory: apps/customer-mobile
        env:
          APP_VARIANT: preview
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo config --type public

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ios-beta
    steps:
      - name: Require the explicit confirmation text
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: '[ "$CONFIRM" = "BUILD-IOS-BETA" ] || { echo "::error::type BUILD-IOS-BETA to start an EAS build"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-11
      - name: Install pinned Node.js (checksum verified)
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" && tar xJf "node-v${NODE_VERSION}-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Start the EAS iOS build (profile testflight; signing credentials are held by EAS)
        working-directory: apps/customer-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN is not configured in the ios-beta environment"; exit 1; }
          pnpm dlx "$EAS_CLI" build --platform ios --profile testflight --non-interactive --no-wait

  submit:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'submit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ios-beta-submit
    steps:
      - name: Require the explicit confirmation text and a build id
        env:
          CONFIRM: ${{ inputs.confirm }}
          BUILD_ID: ${{ inputs.build_id }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          [ "$CONFIRM" = "SUBMIT-TO-TESTFLIGHT" ] || { echo "::error::type SUBMIT-TO-TESTFLIGHT to upload to TestFlight"; exit 1; }
          printf '%s' "$BUILD_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || { echo "::error::build_id must be the EAS build UUID to upload"; exit 1; }
          printf '%s' "$ASC_APP_ID" | grep -Eq '^[0-9]{6,12}$' || { echo "::error::set the environment variable ASC_APP_ID to the numeric App Store Connect app id (not a secret)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-11
      - name: Install pinned Node.js (checksum verified)
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" && tar xJf "node-v${NODE_VERSION}-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Upload exactly the approved build to App Store Connect (App Store Connect API key is held by EAS)
        working-directory: apps/customer-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN is not configured in the ios-beta-submit environment"; exit 1; }
          # eas submit takes the App Store Connect app id from the submit profile, not a flag; the id belongs in the submit profile. Write the validated, non-secret id into the
          # runner's copy of eas.json only (never committed).
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("eas.json","utf8"));c.submit.testflight.ios.ascAppId=process.env.ASC_APP_ID;fs.writeFileSync("eas.json",JSON.stringify(c,null,2));'
          pnpm dlx "$EAS_CLI" submit --platform ios --profile testflight --id "$BUILD_ID" --non-interactive
