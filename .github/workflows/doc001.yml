name: Documentation Consistency
# DOC-001. The job name below is the stable required-status-check context: "Documentation Consistency / DOC-001".
# Trigger: `pull_request`. Verified on 2026-10-20: a `pull_request_target` version of this workflow did NOT run on a PR
# against develop because GitHub reads that event's workflow from the default branch (main), which this project must not
# modify. With `pull_request` the workflow file comes from the PR's merge ref, so a PR could edit THIS file; therefore the
# gate script that executes is always the one at the base SHA (checked out below), nothing from the PR is executed, and
# changes to this file are governance changes that need the Code Owners review (see CODEOWNERS and the ruleset).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doc001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doc001:
    name: Documentation Consistency / DOC-001
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Disposable test - neutralised gate
        run: echo 'gate replaced by a no-op in this PR'
