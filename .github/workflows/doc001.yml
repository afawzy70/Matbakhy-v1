name: Documentation Consistency
# DOC-001. The job name below is the stable required-status-check context: "Documentation Consistency / DOC-001".
# Trigger: `pull_request`. Verified on 2026-10-20: a `pull_request_target` version of this workflow did NOT run on a PR
# against develop because GitHub reads that event's workflow from the default branch (main), which this project must not
# modify. With `pull_request` the workflow file comes from the PR's merge ref, so a PR could edit THIS file; therefore the
# gate script that executes is always the one at the base SHA (checked out below), nothing from the PR is executed, and
# changes to this file are governance changes that need the Code Owners review (see CODEOWNERS and the ruleset).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: doc001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doc001:
    name: Documentation Consistency / DOC-001
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the trusted base branch (gate script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out the pull request as data (not executed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Assess documentation impact
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git -C pr fetch --no-tags origin "$BASE_SHA"
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '.[] | {user: .user.login, state: .state, commit_id: .commit_id}' | python3 -c \
            'import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))' \
            > "$RUNNER_TEMP/reviews.json"
          # Fail closed: the gate that runs is always the base branch's. Never execute anything from the pull request.
          test -f base/scripts/doc001_check.py || { echo "::error::The base branch has no DOC-001 gate; install it through a separately reviewed change"; exit 1; }
          python3 -I base/scripts/doc001_check.py pr --root pr --base "$BASE_SHA" --head "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/pr-body.md" --reviews-file "$RUNNER_TEMP/reviews.json" \
            --author "$PR_AUTHOR"
