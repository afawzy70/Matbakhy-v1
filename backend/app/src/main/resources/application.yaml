spring:
  application:
    name: matbakhy
  jackson:
    time-zone: UTC
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/matbakhy}
    username: ${DATABASE_USERNAME:matbakhy}
    password: ${DATABASE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  session:
    timeout: ${WEB_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
matbakhy:
  identity:
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/matbakhy}
    backchannel-issuer: ${OIDC_BACKCHANNEL_ISSUER:}
    api-audience: ${OIDC_API_AUDIENCE:matbakhy-api}
    web-client-id: ${OIDC_WEB_CLIENT_ID:matbakhy-web}
    web-client-secret: ${OIDC_WEB_CLIENT_SECRET:}
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
    post-login-redirect: ${WEB_POST_LOGIN_REDIRECT:http://localhost:5173/}
    mfa-acr-values: ${OIDC_MFA_ACR_VALUES:mfa,2}
    step-up-max-age: ${OIDC_STEP_UP_MAX_AGE:10m}
  phone-verification:
    # The default pepper is accepted only in LOCAL/CI; deployed environments must provide PHONE_CODE_PEPPER.
    code-pepper: ${PHONE_CODE_PEPPER:local-dev-only-pepper-not-a-secret-000000}
    code-ttl: 5m
    max-attempts: 5
    resend-interval: 60s
    max-sends-per-account-per-hour: ${PHONE_MAX_SENDS_PER_ACCOUNT_PER_HOUR:5}
    max-sends-per-phone-per-hour: ${PHONE_MAX_SENDS_PER_PHONE_PER_HOUR:5}
  # Required: LOCAL, CI, STAGING or PRODUCTION. No default, so a deployment cannot start unconfigured.
  environment: ${APP_ENV}
  market:
    currency: EGP
    timezone: Africa/Cairo
