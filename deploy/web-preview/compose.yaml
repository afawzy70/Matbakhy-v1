# Matbakhy web preview on one VPS (owner direction 2026-10-12): customer web, operations web, API, Keycloak,
# PostgreSQL and S3-compatible image storage. APP_ENV=PREVIEW: synthetic data and providers that never send anything,
# real secrets, HTTPS only, access restricted at the proxy. Not MB-040 staging and not a release environment.
#
# Images are immutable: our two images are referenced by the commit they were built and tested at (see .env.example);
# third-party images are pinned by digest. Nothing is built on the server.
name: matbakhy-preview

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    # The container name travels with every line (attrs.tag) so the log collector can label it (MB-039).
    tag: "{{.Name}}"

services:
  proxy:
    # Caddy with both web builds baked in (deploy/web-preview/front.Dockerfile); terminates HTTPS for every host.
    image: ${FRONT_IMAGE:?set FRONT_IMAGE in .env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?set PREVIEW_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      ALLOWED_CLIENT_IPS: ${ALLOWED_CLIENT_IPS:?set ALLOWED_CLIENT_IPS}
      # Two access classes (Caddyfile). Both default to ALLOWED_CLIENT_IPS; making the customer hosts public is the owner's
      # explicit step: CUSTOMER_ALLOWED_IPS="0.0.0.0/0 ::/0". Kitchen and staff access never follows it.
      CUSTOMER_ALLOWED_IPS: ${CUSTOMER_ALLOWED_IPS:-${ALLOWED_CLIENT_IPS}}
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-${ALLOWED_CLIENT_IPS}}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Switch of the public Keycloak admin console (kc-admin.*): present only while admin-console.sh has hardened and verified it.
      - ${GENERATED_DIR:-/srv/matbakhy-preview/generated}/flags:/srv/flags:ro
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: matbakhy
      POSTGRES_USER: matbakhy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
      - ./postgres/20-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
      - ${BACKUP_DIR:-/srv/matbakhy-backups}:/backups
      - ../../infra/db/reconcile.sql:/reconcile.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matbakhy -d matbakhy"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
    mem_limit: 1536m
    cpus: 1.0

  identity:
    # Production mode (not start-dev): PostgreSQL store, fixed public hostname, TLS terminated by the proxy.
    image: keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://id.${PREVIEW_DOMAIN}
      # Admin console and Admin REST API on their own host (owner approval 2026-10-19, Preview only). The master realm's own URLs follow
      # via its frontendUrl attribute, set by admin-console.sh; the matbakhy realm and its customers stay on id.
      KC_HOSTNAME_ADMIN: https://kc-admin.${PREVIEW_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
    volumes:
      # Rendered by deploy.sh from identity/matbakhy-realm.preview.json; holds secrets, so it lives outside Git.
      - ${GENERATED_DIR:-/srv/matbakhy-preview/generated}/identity:/opt/keycloak/data/import:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Healthy only when the matbakhy realm answers: management readiness is UP well before --import-realm has finished.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/matbakhy/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nX-Forwarded-Proto: https\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"issuer\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 60
    logging: *logging
    mem_limit: 1g
    cpus: 1.0

  storage:
    # SeaweedFS: S3-compatible object storage on a local volume (meal photos and private documents).
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=512", "-volume.max=0"]
    volumes:
      - storage-data:/data
      - ${GENERATED_DIR:-/srv/matbakhy-preview/generated}/storage/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [internal]
    logging: *logging
    mem_limit: 512m
    cpus: 0.5

  api:
    image: ${API_IMAGE:?set API_IMAGE in .env}
    restart: unless-stopped
    environment:
      APP_ENV: PREVIEW
      # Synthetic commerce policy and service zones (db/devdata); EnvironmentGuard allows them only in LOCAL/CI/PREVIEW.
      SPRING_PROFILES_ACTIVE: dev
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # RELEASE_COMMIT: source commit the API image was built from; emitted as service.version in every log line.
      MATBAKHY_VERSION: ${RELEASE_COMMIT:?set RELEASE_COMMIT in .env}
      # Behind the proxy: build https://api.<domain> URLs (OIDC redirect) from X-Forwarded-* sent by the internal proxy.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      # MB-039: health and Prometheus metrics on a separate management port (8081) that the proxy never forwards.
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      DATABASE_URL: jdbc:postgresql://postgres:5432/matbakhy
      # MB-039: the API runs as a least-privilege role; Flyway migrates as the owner and grants the
      # runtime role in its afterMigrate callback (backend db/migration/afterMigrate.sql).
      DATABASE_USERNAME: matbakhy_app
      DATABASE_PASSWORD: ${APP_DB_PASSWORD}
      DATABASE_RUNTIME_ROLE: matbakhy_app
      SPRING_FLYWAY_USER: matbakhy
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER: https://id.${PREVIEW_DOMAIN}/realms/matbakhy
      OIDC_BACKCHANNEL_ISSUER: http://identity:8080/realms/matbakhy
      OIDC_WEB_CLIENT_SECRET: ${OIDC_WEB_CLIENT_SECRET:?set OIDC_WEB_CLIENT_SECRET}
      OIDC_ADMIN_CLIENT_SECRET: ${OIDC_ADMIN_CLIENT_SECRET:-}
      WEB_ALLOWED_ORIGINS: https://app.${PREVIEW_DOMAIN},https://ops.${PREVIEW_DOMAIN}
      # The web apps (app., ops.) read the XSRF-TOKEN cookie that the API (api.) sets: it must be set for the parent domain, or every
      # browser mutation is refused with 403 (found by the remote browser E2E).
      WEB_COOKIE_DOMAIN: ${PREVIEW_DOMAIN}
      WEB_POST_LOGIN_REDIRECT: https://app.${PREVIEW_DOMAIN}/
      STAFF_BOOTSTRAP_SUBJECT: ${STAFF_BOOTSTRAP_SUBJECT:-}
      PHONE_CODE_PEPPER: ${PHONE_CODE_PEPPER:?set PHONE_CODE_PEPPER}
      HANDOVER_HASH_KEY: ${HANDOVER_HASH_KEY:?set HANDOVER_HASH_KEY}
      ACTIVITY_HASH_KEY: ${ACTIVITY_HASH_KEY:?set ACTIVITY_HASH_KEY}
      HANDOVER_ENCRYPTION_KEY: ${HANDOVER_ENCRYPTION_KEY:?set HANDOVER_ENCRYPTION_KEY}
      # O07: external push delivery stays off until approved, credentialed and tested on devices (in-app notifications are unaffected).
      PUSH_DELIVERY_ENABLED: ${PUSH_DELIVERY_ENABLED:-false}
      PUSH_TOKEN_HASH_KEY: ${PUSH_TOKEN_HASH_KEY:?set PUSH_TOKEN_HASH_KEY}
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:?set PUSH_TOKEN_ENCRYPTION_KEY}
      OBJECT_STORAGE_ENDPOINT: http://storage:8333
      OBJECT_STORAGE_CLIENT_ENDPOINT: https://media.${PREVIEW_DOMAIN}
      OBJECT_STORAGE_PUBLIC_BASE_URL: https://media.${PREVIEW_DOMAIN}/matbakhy-public
      OBJECT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 60
    logging: *logging
    mem_limit: 2g
    cpus: 1.5

  # --- MB-039 observability (OPS-01/OPS-02). Internal network only; Grafana is published on the host loopback and
  # reached through an SSH tunnel. Retention values are the proposed staging defaults, not approved policies (O06). ---
  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOG_RETENTION: ${LOG_RETENTION:-720h}
      DEBUG_LOG_RETENTION: ${DEBUG_LOG_RETENTION:-168h}
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [internal]
    logging: *logging
    mem_limit: 384m
    cpus: 0.5

  alloy:
    image: grafana/alloy:v1.10.2@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    restart: unless-stopped
    user: "0"
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "--disable-reporting", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [internal]
    depends_on: [loki]
    logging: *logging
    mem_limit: 256m
    cpus: 0.25

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-15d}
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    logging: *logging
    mem_limit: 512m
    cpus: 0.5

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [internal]
    logging: *logging
    mem_limit: 128m
    cpus: 0.25

  # Local test destination for alerts (no real recipients without the owner's authorization).
  alert-sink:
    image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    restart: unless-stopped
    command: ["python", "-I", "/sink/alert-sink.py"]
    volumes:
      - ./observability/alert-sink.py:/sink/alert-sink.py:ro
      - alert-sink-data:/data
    networks: [internal]
    logging: *logging
    mem_limit: 64m
    cpus: 0.1

  # Host disk usage and the backup age (deploy.sh backup writes matbakhy_backup.prom into BACKUP_DIR/metrics).
  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.textfile
      - --collector.meminfo
      - --collector.loadavg
    volumes:
      - /:/host:ro
      - ${BACKUP_DIR:-/srv/matbakhy-backups}/metrics:/textfile:ro
    networks: [internal]
    logging: *logging
    mem_limit: 64m
    cpus: 0.1

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ops-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000/
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [internal, ops]
    logging: *logging
    mem_limit: 256m
    cpus: 0.25

networks:
  edge: {}
  # Only for Grafana's loopback port (127.0.0.1:3000); nothing else joins it.
  ops: {}
  # No route to the internet for the database, identity provider, storage and API; only the proxy is published.
  internal:
    internal: true

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:
  loki-data:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  alert-sink-data:
  grafana-data:
