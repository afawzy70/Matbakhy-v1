# MB-039 (OPS-02): metrics collection inside the preview's internal network. Nothing here is published; the API's
# Prometheus endpoint is on its management port (8081), which the proxy never forwards.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["api:8081"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: alloy
    static_configs: [{targets: ["alloy:12345"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
