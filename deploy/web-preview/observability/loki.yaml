# MB-039 (OPS-01): single-node log store on the preview host. Bounded by retention (compactor); the period is a
# REHEARSAL value pending O06, not an approved retention policy.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  retention_period: ${LOG_RETENTION:-168h}
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_lookback: ${LOG_RETENTION:-168h}
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
analytics:
  reporting_enabled: false
