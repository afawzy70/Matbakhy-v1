components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MATBAKHY_SESSION
      description: Server-managed web session (HttpOnly, Secure, SameSite); mutations also require the CSRF token. Final cookie name fixed in MB-009.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Native app access token from OIDC authorization code + PKCE.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor from a previous page
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9-]+$
      description: Persisted random UUID reused on every retry of the same command
  responses:
    Error:
      description: Standard error
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Address:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - recipientName
        - phoneE164
        - governorate
        - city
        - zoneId
        - street
        - building
        - floor
        - unit
        - landmark
        - latitude
        - longitude
        - version
      properties:
        id: &a4
          type: string
          format: uuid
        label: &a7
          type: string
          minLength: 1
          maxLength: 40
        recipientName: &a8
          type: string
          minLength: 1
          maxLength: 120
        governorate: &a9
          type: string
          minLength: 1
          maxLength: 80
        city: &a10
          type: string
          minLength: 1
          maxLength: 80
        zoneId: *a4
        street: &a11
          type: string
          minLength: 1
          maxLength: 200
        building: &a12
