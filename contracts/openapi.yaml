components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MATBAKHY_SESSION
      description: Server-managed web session (HttpOnly, Secure, SameSite); mutations also require the CSRF token. Final cookie name fixed in MB-009.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Native app access token from OIDC authorization code + PKCE.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor from a previous page
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9-]+$
      description: Persisted random UUID reused on every retry of the same command
  responses:
    Error:
      description: Standard error
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Address:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - recipientName
        - phoneE164
        - governorate
        - city
        - zoneId
        - street
        - building
        - floor
        - unit
        - landmark
        - latitude
        - longitude
        - version
      properties:
        id: &a4
          type: string
          format: uuid
        label: &a7
          type: string
          minLength: 1
          maxLength: 40
        recipientName: &a8
          type: string
          minLength: 1
          maxLength: 120
        governorate: &a9
          type: string
          minLength: 1
          maxLength: 80
        city: &a10
          type: string
          minLength: 1
          maxLength: 80
        zoneId: *a4
        street: &a11
          type: string
          minLength: 1
          maxLength: 200
        building: &a12
          type: string
          minLength: 1
          maxLength: 40
        floor: &a13
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 20
        unit: &a14
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 20
        landmark: &a15
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        latitude: &a16
          type:
            - number
            - "null"
          minimum: -90
          maximum: 90
        longitude: &a17
          type:
            - number
            - "null"
          minimum: -180
          maximum: 180
        phoneE164:
          type: string
          pattern: ^\+201[0125][0-9]{8}$
        version:
          type: integer
          minimum: 0
      description: Owner-only. Coordinates are optional and never override zoneId.
    AddressPage:
      type: object
      additionalProperties: false
      required:
        - items
        - hasMore
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Address"
          maxItems: 20
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - messageKey
        - fieldErrors
        - requestId
        - retryable
      properties:
        code:
          type: string
          enum:
            - MALFORMED_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - ACCOUNT_DISABLED
            - STEP_UP_REQUIRED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - UNSUPPORTED_MEDIA_TYPE
            - VALIDATION_FAILED
            - CONTACT_VERIFICATION_REQUIRED
            - VERIFICATION_FAILED
            - STATE_CONFLICT
            - VERSION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - STOCK_CHANGED
            - PRICE_CHANGED
            - QUOTE_EXPIRED
            - SLOT_CLOSED
            - KITCHEN_UNAVAILABLE
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL_ERROR
        messageKey:
          type: string
          pattern: ^error\.[a-z_]+$
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type:
            - string
            - "null"
        retryable:
          type: boolean
      description: Standard error body; matches backend ErrorCode/ApiError.
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
    ApplicationSummary:
      type: object
      additionalProperties: false
      description: Queue row without private fields.
      required: [id, state, publicName, currentRevision, submittedAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/CookApplicationState"
        publicName:
          type:
            - string
            - "null"
          maxLength: 80
        currentRevision:
          type: integer
          minimum: 0
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
    ApplicationReview:
      type: object
      additionalProperties: false
      description: Reviewer view of submitted revisions including private fields; every read is audited. Document access arrives with media (MB-013).
      required: [id, applicantId, state, currentRevision, revisions, kitchenId, version]
      properties:
        id:
          type: string
          format: uuid
        applicantId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/CookApplicationState"
        currentRevision:
          type: integer
          minimum: 0
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/CookApplicationRevision"
        kitchenId:
          type:
            - string
            - "null"
          format: uuid
        version:
          type: integer
          minimum: 0
    CookApplicationRevision:
      type: object
      additionalProperties: false
      description: Immutable submitted snapshot; decision fields are set once.
      required: [revision, publicName, bio, contactPhone, privateLocation, pickupEnabled, zoneIds, submittedAt, decision, decisionReason, reviewerId, decidedAt]
      properties:
        revision:
          type: integer
          minimum: 1
        publicName:
          type: string
        bio:
          type: string
        contactPhone:
          type: string
        privateLocation:
          type: string
        pickupEnabled:
          type: boolean
        zoneIds:
          type: array
          items:
            type: string
            format: uuid
        submittedAt:
          type: string
          format: date-time
        decision:
          type:
            - string
            - "null"
          enum: [APPROVED, CHANGES_REQUESTED, REJECTED, null]
        decisionReason:
          type:
            - string
            - "null"
          maxLength: 1000
        reviewerId:
          type:
            - string
            - "null"
          format: uuid
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - occurredAt
        - actorId
        - action
        - permission
        - objectType
        - objectId
        - outcome
        - reason
        - requestId
        - details
      properties:
        id: *a5
        occurredAt: &a6
          type: string
          format: date-time
        actorId:
          type:
            - string
            - "null"
          format: uuid
        action:
          type: string
        permission:
          type:
            - string
            - "null"
        objectType:
          type:
            - string
            - "null"
        objectId:
          type:
            - string
            - "null"
        outcome:
          type: string
          enum:
            - ALLOWED
            - DENIED
        reason:
          type:
            - string
            - "null"
          description: Redacted
        requestId:
          type:
            - string
            - "null"
        details:
          type: string
          description: Redacted JSON object
    AuditPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
