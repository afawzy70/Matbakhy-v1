          type: array
          maxItems: 0
          items:
            type: string
            format: uuid
    PostOpsConfigurationVersionsRequest:
      type: object
      additionalProperties: false
      description: >-
        Keys: commerce-policy (value = all CommercePolicyVersion fields except version/status/approvedAt; a real policy needs
        approvalReference; synthetic only in LOCAL/CI), zone:{zoneId} (value {active, deliveryFeeMinor}), flag:ordering-enabled
        (value {enabled}). expectedVersion is the current version of that key (0 when none). Applies now; future effectiveAt
        is 422 SCHEDULED_CHANGES_NOT_SUPPORTED. Only new quotes use the change: an existing unplaced quote is not honored at its
        old values; placing it fails revalidation (409 PRICE_CHANGED, reason POLICY_CHANGED or TOTAL_CHANGED; TC-020/TC-042)
        and needs a fresh quote. Placed orders keep their snapshots. Needs config.write and recent MFA.
      required: [value, reason, expectedVersion]
      properties:
        value:
          type: object
          additionalProperties: true
        effectiveAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        approvalReference:
          type: string
          minLength: 3
          maxLength: 200
        expectedVersion:
          type: integer
          minimum: 0
    PostOpsCooksDecisionRequest:
      type: object
      additionalProperties: false
      description: START_REVIEW moves SUBMITTED to UNDER_REVIEW; the other decisions need UNDER_REVIEW and a reason. A reviewer cannot decide their own application.
      required: [decision, revision, expectedVersion]
      properties:
        decision:
          type: string
          enum: [START_REVIEW, APPROVE, REQUEST_CHANGES, REJECT]
        reason:
          type:
            - string
            - "null"
          minLength: 3
          maxLength: 1000
        revision:
          type: integer
          minimum: 1
        expectedVersion:
          type: integer
          minimum: 0
