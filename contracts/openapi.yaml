        purpose:
          type: string
          enum: [MEAL_PHOTO, COOK_DOCUMENT]
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Display only; path components are removed and it never becomes a storage key
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
        bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
