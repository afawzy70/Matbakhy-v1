# Matbakhy API contract. Source of truth for clients; see docs/engineering/03-api-contract.md.
openapi: 3.1.1
info:
  title: Matbakhy API
  version: 0.1.0
  description: "Contract for the Matbakhy MVP (Egypt, EGP, Africa/Cairo). Generated from contracts/endpoints.json in MB-007 and maintained by hand since. Operations with x-implemented: false are designed, not implemented. Schemas marked x-schema-status: PENDING are untyped placeholders that their owning story must define before client use. OIDC login/callback/logout routes are framework-managed and documented in MB-009."
servers:
  - url: /
tags:
  - name: account
    description: Customer profile, phone verification, addresses, favorites, devices and deletion requests
  - name: configuration
    description: Public, non-sensitive configuration
  - name: cook
    description: "Cook workspace: application, meals, slots, orders, cash reports and statements"
  - name: kitchens
    description: Public kitchen profiles, slots and reviews
  - name: meals
    description: Public meal discovery and detail
  - name: notifications
    description: Customer in-app notification inbox
  - name: operations
    description: "Platform backoffice: approvals, moderation, orders, support, finance, configuration, staff and audit"
  - name: orders
    description: Customer orders, events, cancellation and reviews
  - name: policies
    description: Published policy documents
  - name: quotes
    description: Authoritative server quotes
  - name: reviews
    description: Review reporting
  - name: support
    description: Customer support cases
  - name: uploads
    description: Scoped media and document uploads
  - name: zones
    description: Service zones
paths:
  /api/v1/configuration/public:
    get:
      operationId: getConfigurationPublic
      tags:
        - configuration
      summary: "API-001: public configuration (ordering availability and order limits)"
      description: Ordering availability and the active commerce policy's order limits, so clients bound quantity controls by the
        server's value. The quote remains the enforcement point. Locale, zones summary, fulfillment modes and support/public policy
        versions are planned additions. Never exposes commission, tax or staff-only policy fields.
      x-matbakhy-id: API-001
      x-permission: PUBLIC
      x-implemented: true
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfiguration"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/zones:
    get:
      operationId: getZones
      tags:
        - zones
      summary: "API-002: cityId, active=true, cursor, limit; no private cook locations"
      description: cityId, active=true, cursor, limit; no private cook locations
      x-matbakhy-id: API-002
      x-permission: PUBLIC
      x-implemented: true
      security: []
      parameters:
        - name: Accept-Language
          in: header
          required: false
          description: Arabic by default; English when preferred and available
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZonePage"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/meals:
    get:
      operationId: getMeals
      tags:
        - meals
      summary: "API-003: q, zoneId, date, slotId, categoryId, minPriceMinor, maxPriceMinor, sort, cursor, limit"
      description: q, zoneId, date, slotId, categoryId, minPriceMinor, maxPriceMinor, sort, cursor, limit
      x-matbakhy-id: API-003
      x-permission: PUBLIC
      x-implemented: true
      security: []
      parameters:
        - name: Accept-Language
          in: header
          required: false
          description: Arabic by default; English when preferred and available
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Meal title (Arabic or English) or kitchen name; Arabic diacritics and letter variants are ignored
          schema:
            type: string
            maxLength: 80
        - name: zoneId
          in: query
          required: false
          description: Only kitchens delivering to this zone
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: false
          description: Local Cairo date with an orderable slot
          schema:
            type: string
            format: date
        - name: slotId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MealCategory"
        - name: minPriceMinor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: maxPriceMinor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: kitchenId
          in: query
          required: false
          description: Meals of one kitchen (cook profile page)
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [NEWEST, PRICE_ASC, PRICE_DESC]
            default: NEWEST
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPage"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/meals/{mealId}:
    get:
      operationId: getMealsById
      tags:
        - meals
      summary: "API-004: published public meal or 404"
      description: published public meal or 404
      x-matbakhy-id: API-004
      x-permission: PUBLIC
      x-implemented: true
      security: []
      parameters:
        - name: Accept-Language
          in: header
          required: false
          description: Arabic by default; English when preferred and available
          schema:
            type: string
        - name: mealId
          in: path
          required: true
          schema: &a1
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDetail"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
