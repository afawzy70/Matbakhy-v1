    StatementPage:
      type: object
      additionalProperties: false
      description: >-
        Kitchen statement for a Cairo date range of order completion: completed orders, cash position, posted commission,
        refunds of those orders, commission reversals and settlements. Cash collected by the cook is not platform revenue;
        only the commission is receivable (direction COOK_PAYS_PLATFORM). Outstanding = posted - reversed - reconciled.
      required: [kitchenId, from, to, direction, includes, summary, items, refunds, settlements, unsettledEntries, nextCursor, hasMore]
      properties:
        kitchenId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [COOK_PAYS_PLATFORM]
        refunds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, orderId, amount, state, paymentReference, version]
            properties:
              id:
                type: string
                format: uuid
              orderId:
                type: string
                format: uuid
              amount:
                $ref: "#/components/schemas/Money"
              state:
                $ref: "#/components/schemas/RefundState"
              paymentReference:
                type: [string, "null"]
              version:
                type: integer
                minimum: 0
        settlements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, periodFrom, periodTo, state, total, paymentReference, version]
            properties:
              id:
                type: string
                format: uuid
              periodFrom:
                type: string
                format: date
              periodTo:
                type: string
                format: date
              state:
                $ref: "#/components/schemas/SettlementState"
              total:
                $ref: "#/components/schemas/Money"
              paymentReference:
                type: [string, "null"]
              version:
                type: integer
                minimum: 0
        unsettledEntries:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/SettlementLine"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        includes:
          type: array
          items:
            type: string
            enum: [COMPLETED_ORDERS, CASH_POSITION, COMMISSION, REFUNDS, SETTLEMENTS]
        summary:
          type: object
          additionalProperties: false
          required: [completedOrders, ordersTotal, cashReported, cashVerified, cashOutstanding, commissionPosted, commissionPending, commissionReversed,
                     commissionSettled, commissionOutstanding]
          properties:
            completedOrders:
              type: integer
              minimum: 0
            ordersTotal:
              $ref: "#/components/schemas/Money"
            cashReported:
              $ref: "#/components/schemas/Money"
            cashVerified:
              $ref: "#/components/schemas/Money"
            cashOutstanding:
              $ref: "#/components/schemas/Money"
            commissionPosted:
              $ref: "#/components/schemas/Money"
            commissionPending:
              type: integer
              minimum: 0
              description: Completed orders whose commission is not posted yet.
            commissionReversed:
              $ref: "#/components/schemas/Money"
            commissionSettled:
              $ref: "#/components/schemas/Money"
            commissionOutstanding:
              $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [orderId, publicNumber, completedAt, orderTotal, cashState, commission, commissionState]
            properties:
              orderId:
