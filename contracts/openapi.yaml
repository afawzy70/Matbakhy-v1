      x-implemented: true
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9-]{3,80}$
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenPublic"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/kitchens/{kitchenId}/slots:
    get:
      operationId: getKitchensSlots
      tags:
        - kitchens
      summary: "API-006: date, fulfillmentMode, zoneId; future eligible slots"
      description: date, fulfillmentMode, zoneId; future eligible slots
      x-matbakhy-id: API-006
      x-permission: PUBLIC
      x-implemented: true
      security: []
      parameters:
        - name: kitchenId
          in: path
          required: true
          schema: *a1
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fulfillmentMode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FulfillmentMode"
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPage"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/kitchens/{kitchenId}/reviews:
    get:
      operationId: getKitchensReviews
      tags:
        - kitchens
      summary: "API-007: visible only, cursor, limit"
      description: visible only, cursor, limit
      x-matbakhy-id: API-007
      x-permission: PUBLIC
      x-implemented: true
      security: []
      parameters:
        - name: kitchenId
          in: path
          required: true
          schema: *a1
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/policies/{key}:
    get:
      operationId: getPoliciesById
      tags:
        - policies
      summary: "API-008: published version, locale, effectiveAt; draft only in dev"
      description: published version, locale, effectiveAt; draft only in dev
      x-matbakhy-id: API-008
      x-permission: PUBLIC
      x-implemented: false
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema: &a3
            type: string
            pattern: ^[a-z0-9-]{1,64}$
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDocument"
        4XX:
          $ref: "#/components/responses/Error"
        5XX:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      tags:
